services:
  # ========================================================
  # APPLICATION POSTGRESQL
  # ========================================================

  postgres:
    image: postgres:16
    container_name: epra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: epra_dw
      POSTGRES_USER: epra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_PUBLISHED:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epra_user -d epra_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # AIRFLOW DATABASE
  # ========================================================

  airflow-postgres:
    image: postgres:16
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================
  # AIRFLOW INIT
  # ========================================================

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/epra-airflow.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: epra_dw
      POSTGRES_USER: epra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./credentials:/opt/airflow/credentials:ro
      - ./config.py:/opt/airflow/config.py
      - ./.env:/opt/airflow/.env:ro
      - ./epra_warehouse:/opt/airflow/dbt/epra_warehouse
      - ./dbt/profiles.yml:/opt/airflow/dbt/profiles.yml:ro
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users list --output json | grep -q '"username": "admin"' || \
          airflow users create \
            --username admin \
            --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname Airflow \
            --lastname Admin \
            --role Admin \
            --email admin@example.com)

  # ========================================================
  # AIRFLOW WEBSERVER
  # ========================================================

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/epra-airflow.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: epra_dw
      POSTGRES_USER: epra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in .env}
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./credentials:/opt/airflow/credentials:ro
      - ./config.py:/opt/airflow/config.py
      - ./.env:/opt/airflow/.env:ro
      - ./epra_warehouse:/opt/airflow/dbt/epra_warehouse
      - ./dbt/profiles.yml:/opt/airflow/dbt/profiles.yml:ro
    command:
      - webserver

  # ========================================================
  # AIRFLOW SCHEDULER
  # ========================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      PYTHONPATH: /opt/airflow
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/credentials/epra-airflow.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: epra_dw
      POSTGRES_USER: epra_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?Set GCP_PROJECT_ID in .env}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./credentials:/opt/airflow/credentials:ro
      - ./config.py:/opt/airflow/config.py
      - ./.env:/opt/airflow/.env:ro
      - ./epra_warehouse:/opt/airflow/dbt/epra_warehouse
      - ./dbt/profiles.yml:/opt/airflow/dbt/profiles.yml:ro
    command:
      - scheduler

volumes:
  postgres_data:
  airflow_postgres_data:
